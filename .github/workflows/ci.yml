name: SentinelAI CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libgomp1
      - name: Install test and build dependencies
        run: python -m pip install -e ".[dev,ml,build,audit]"
      - name: Lint and type-check
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy
      - name: Run tests
        run: python -m pytest -q
      - name: Build and smoke-test Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build_windows.ps1 -SmokeTest
      - name: Build and smoke-test Linux executable
        if: runner.os == 'Linux'
        run: bash scripts/build_linux.sh --smoke-test
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the local Docker desktop
        run: docker compose up --build --detach --wait --wait-timeout 90
      - name: Verify the noVNC page and SentinelAI window
        run: |
          curl --fail --silent --show-error http://127.0.0.1:6080/vnc.html --output /dev/null
          for attempt in {1..25}; do
            if docker compose exec -T sentinelai xwininfo -root -tree | grep -Fq '"SentinelAI"'; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Run executable analysis inside the image
        run: |
          docker compose exec -T -e QT_QPA_PLATFORM=offscreen sentinelai \
            python -m app --smoke-test --data-dir /tmp/sentinelai-smoke
      - name: Print desktop logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop desktop
        if: always()
        run: docker compose down
