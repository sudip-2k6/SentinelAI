name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/windows/**'
      - 'scripts/build_installer.ps1'
      - 'pyproject.toml'
      - '.github/workflows/windows-installer.yml'
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build setup executable
        shell: pwsh
        run: ./scripts/build_installer.ps1
      - name: Install, launch a smoke scan, and uninstall
        shell: pwsh
        run: |
          $setup = Resolve-Path 'dist/installer/SentinelAI-Setup-x64.exe'
          $target = Join-Path $env:RUNNER_TEMP 'SentinelAI installer smoke'
          $log = Join-Path $env:RUNNER_TEMP 'sentinel-installer.log'
          $args = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/DIR="' + $target + '"'), ('/LOG="' + $log + '"'))
          $result = Start-Process $setup -ArgumentList $args -Wait -PassThru -WindowStyle Hidden
          if ($result.ExitCode -ne 0) {
            Get-Content -LiteralPath $log -Tail 75
            $details = Join-Path ([IO.Path]::GetTempPath()) 'SentinelAI-Setup.log'
            if (Test-Path -LiteralPath $details) { Get-Content -LiteralPath $details -Tail 25 }
            throw "Installer failed ($($result.ExitCode))."
          }
          $desktop = Join-Path $target 'runtime/pythonw.exe'
          if (-not (Test-Path -LiteralPath $desktop)) { throw 'Desktop launcher missing.' }
          & (Join-Path $target 'runtime/python.exe') -I -m app --smoke-test --data-dir (Join-Path $env:RUNNER_TEMP 'SentinelAI scan smoke')
          if ($LASTEXITCODE -ne 0) { throw 'Installed application smoke test failed.' }
          $result = Start-Process (Join-Path $target 'unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru -WindowStyle Hidden
          if ($result.ExitCode -ne 0 -or (Test-Path -LiteralPath $desktop)) { throw 'Uninstall failed.' }
      - name: Create checksum
        shell: pwsh
        run: |
          $file = 'dist/installer/SentinelAI-Setup-x64.exe'
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant()
          "$hash  SentinelAI-Setup-x64.exe" | Set-Content -Encoding ascii "$file.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: sentinelai-windows-installer
          path: dist/installer/SentinelAI-Setup-x64.exe*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sentinelai-windows-installer
          path: installer
      - name: Publish the tested installer
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" installer/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "SentinelAI $RELEASE_TAG" --latest \
            --notes "Download SentinelAI-Setup-x64.exe for Windows 10 or 11 (x64). Setup installs for your Windows account and downloads dependencies on first install. The installer is unsigned. A SHA-256 checksum is included."
